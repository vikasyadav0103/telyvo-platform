name: TELYVO CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telyvo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend production build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
