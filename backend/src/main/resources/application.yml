spring:
  application:
    name: telyvo-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

telyvo:
  discovery:
    serp-api-key: ${SERPAPI_KEY:}
    base-url: ${SERPAPI_BASE_URL:https://serpapi.com/search.json}
    timeout-seconds: ${SERPAPI_TIMEOUT_SECONDS:8}
    max-results: ${SERPAPI_MAX_RESULTS:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.telyvo: INFO